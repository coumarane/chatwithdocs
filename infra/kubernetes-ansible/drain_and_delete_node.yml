---
- name: Cordon node {{ current_worker_node }}
  ansible.builtin.command: kubectl --kubeconfig {{ kubeconfig_path }} cordon {{ current_worker_node }}
  changed_when: false

- name: Drain node {{ current_worker_node }}
  ansible.builtin.command: kubectl --kubeconfig {{ kubeconfig_path }} drain {{ current_worker_node }} --ignore-daemonsets --delete-emptydir-data --force
  register: drain_output
  changed_when: true

- name: Delete node {{ current_worker_node }} object from cluster
  ansible.builtin.command: kubectl --kubeconfig {{ kubeconfig_path }} delete node {{ current_worker_node }}
  changed_when: true

- name: Stop containerd service (if containerd is used)
  ansible.builtin.systemd:
    name: containerd
    state: stopped
    enabled: no
  ignore_errors: yes
  when: ansible_facts.packages.containerd is defined

- name: Clean up containerd data directory (if containerd is used)
  ansible.builtin.file:
    path: /var/lib/containerd
    state: absent
  ignore_errors: yes
  when: ansible_facts.packages.containerd is defined
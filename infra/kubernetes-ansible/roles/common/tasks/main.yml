# kubernetes-ansible/roles/common/tasks/main.yml

- name: Update apt cache and upgrade all packages
  ansible.builtin.apt:
    update_cache: yes
    upgrade: dist
  tags:
    - system_prep

- name: Install required packages
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gpg
      - containerd
    state: present
  tags:
    - system_prep

- name: Disable swap and comment swap in fstab
  shell: |
    swapoff -a
    sed -i '/ swap / s/^/#/' /etc/fstab
  become: true
  tags:
    - system_prep

- name: Ensure kernel modules are loaded
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
  tags:
    - system_prep

- name: Load kernel modules immediately
  ansible.builtin.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter
  tags:
    - system_prep

- name: Configure sysctl for Kubernetes networking
  ansible.builtin.copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-ip6tables = 1
      net.bridge.bridge-nf-call-iptables = 1
      net.ipv4.ip_forward = 1
  tags:
    - system_prep

- name: Apply sysctl settings immediately
  ansible.builtin.command: sysctl --system
  tags:
    - system_prep

- name: Create containerd config directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
  tags:
    - containerd

- name: Generate default containerd config
  ansible.builtin.command: containerd config default
  register: containerd_default_config
  changed_when: false

- name: Apply containerd config with systemd cgroup driver
  ansible.builtin.copy:
    dest: /etc/containerd/config.toml
    content: "{{ containerd_default_config.stdout | regex_replace('SystemdCgroup = false', 'SystemdCgroup = true') }}"
    mode: "0644"
  notify: Restart containerd
  tags:
    - containerd

# handlers/main.yml
- name: Restart containerd
  ansible.builtin.systemd:
    name: containerd
    state: restarted

- name: Enable and start containerd service
  ansible.builtin.systemd:
    name: containerd
    enabled: yes
    state: started
  tags:
    - containerd
